[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasnipper-lite"
version = "0.1.0"
description = "Lightweight toolkit for DataSnipper-style document reconciliation workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "datasnipper-lite maintainers" }
]
keywords = ["datasnipper", "document-matching", "excel", "pdf", "reconciliation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Text Processing :: General"
]
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "rapidfuzz>=3.0"
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11", "camelot-py[cv]>=0.11"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "black>=24.0", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "--strict-markers --disable-warnings"
testpaths = ["tests"]
